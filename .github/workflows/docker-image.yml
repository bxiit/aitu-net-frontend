name: Build image and push to Docker Hub

on:
  push:
    branches: [ main ]

jobs:
  build-docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Docker sign-in
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Layer cache in GitHub Actions cache: `npm ci` is skipped when package-lock.json is unchanged
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/aitu-net-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-server:
    runs-on: ubuntu-latest
    needs: build-docker-image
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/aitu-net-frontend:latest
            
            NEW_IMAGE_ID=$(docker images "${{ secrets.DOCKER_USERNAME }}/aitu-net-frontend" --format "{{.ID}}" | head -n 1)
            
            docker stop aitu-net-frontend || true
            docker rm aitu-net-frontend || true

            docker images "${{ secrets.DOCKER_USERNAME }}/aitu-net-frontend" --format "{{.ID}}" | grep -v "$NEW_IMAGE_ID" | xargs -r docker rmi -f || true

            docker run -d --name aitu-net-frontend --network aitu-net -p 127.0.0.1:3000:3000 ${{ secrets.DOCKER_USERNAME }}/aitu-net-frontend:latest
