# Production stack for the deploy host. The deploy workflow copies this file to
# $DEPLOY_PATH/compose.yml and writes $DEPLOY_PATH/.env with the variables used below.
services:
  frontend:
    image: ghcr.io/bxiit/aitu-net-frontend:${IMAGE_TAG:?IMAGE_TAG is not set}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:?HOST_PORT is not set}:3000"
    # shared with the backend stack, so the Next server can proxy /api and /ws to aitu-backend
    networks:
      - aitu-net

networks:
  aitu-net:
    external: true
